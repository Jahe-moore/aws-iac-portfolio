name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# id-token: write is what allows the OIDC login to AWS (no stored keys).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Security scan (Checkov)
        run: |
          pip install --quiet checkov
          checkov -d . --framework terraform -o json > checkov.json || true
          python3 - <<'EOF'
          import json
          data = json.load(open("checkov.json"))
          reports = data if isinstance(data, list) else [data]
          passed = failed = 0
          failures, skips = [], []
          for r in reports:
              res = r.get("results", {})
              passed += r.get("summary", {}).get("passed", 0)
              failures += res.get("failed_checks", [])
              for c in res.get("skipped_checks", []):
                  skips.append({"id": c["check_id"], "reason": (c.get("check_result") or {}).get("suppress_comment", "")})
          failed = len(failures)
          json.dump({"tool": "Checkov", "passed": passed, "failed": failed,
                     "skipped": len(skips), "skips": skips}, open("scan.json", "w"))
          print(f"passed {passed}, failed {failed}, skipped {len(skips)}")
          for c in failures:
              print("FAILED", c["check_id"], c["resource"], c["file_path"])
          if passed == 0:
              raise SystemExit("scan produced no results")
          if failed:
              raise SystemExit(1)
          EOF

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: infra
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      # Everything below runs only on a push to main. Pull requests stop at the plan.
      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Publish site files and deploy status
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BUCKET=$(terraform -chdir=infra output -raw site_bucket)
          DIST=$(terraform -chdir=infra output -raw distribution_id)
          python3 - <<'EOF'
          import json, os, datetime
          sha = os.environ["GITHUB_SHA"]
          repo = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          json.dump({
              "deployed_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit": sha[:7],
              "commit_url": f"{repo}/commit/{sha}",
          }, open("deploy.json", "w"))
          EOF
          # Publish the repository files so the page can show its own source.
          git ls-files | grep -v '^site/' > files.txt
          while read -r f; do mkdir -p "site/source/$(dirname "$f")"; cp "$f" "site/source/$f"; done < files.txt
          python3 -c "import json; order = ['README.md', 'infra/', 'bootstrap/', '.github/']; files = open('files.txt').read().split(); key = lambda f: (next((i for i, p in enumerate(order) if f.startswith(p)), len(order)), f); json.dump(sorted(files, key=key), open('site/source/manifest.json', 'w'))"
          aws s3 sync site/ "s3://$BUCKET" --delete --only-show-errors
          aws s3 cp deploy.json "s3://$BUCKET/status/deploy.json" --content-type application/json --cache-control no-cache
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
          echo "Site: $(terraform -chdir=infra output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
