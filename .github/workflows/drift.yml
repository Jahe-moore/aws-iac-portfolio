name: drift-check

# Nightly: does AWS still match the code? terraform plan exits 2 when it finds
# a difference (someone changed something outside Terraform), which fails the run.
on:
  schedule:
    - cron: "0 9 * * *" # 2 AM Arizona time
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # Exit code 2 means AWS no longer matches the code; the run fails and GitHub emails the owner.
      - name: Plan for drift
        working-directory: infra
        run: terraform plan -input=false -detailed-exitcode -lock=false
